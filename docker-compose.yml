services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      APP_ENV: development
      STORAGE_ROOT: /app/.data/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: video-ai-assets
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: video_ai
      S3_SECRET_ACCESS_KEY: video_ai_dev_password
      S3_PUBLIC_BASE_URL: http://localhost:9000/video-ai-assets
      VIDEO_GENERATOR_BACKEND: ${VIDEO_GENERATOR_BACKEND:-mock}
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-fastapi}
      JOB_REPOSITORY_BACKEND: ${JOB_REPOSITORY_BACKEND:-memory}
      SQLITE_DATABASE_PATH: /app/.data/video_ai.sqlite3
      DATABASE_URL: postgresql+psycopg://video_ai:video_ai_dev@postgres:5432/video_ai
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: video-ai
      VLLM_TEXT_BASE_URL: http://vllm-text:8000/v1
      VLLM_VISION_BASE_URL: http://vllm-vision:8000/v1
    volumes:
      - ./.data:/app/.data
    ports:
      - "8000:8000"
    profiles: ["mock", "ltx", "prod"]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
    profiles: ["mock", "ltx", "prod"]

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: rq worker ${RQ_QUEUE_NAME:-video-ai} --url ${REDIS_URL:-redis://redis:6379/0}
    environment:
      APP_ENV: production
      TASK_QUEUE_BACKEND: redis-rq
      JOB_REPOSITORY_BACKEND: postgres
      SQLITE_DATABASE_PATH: /app/.data/video_ai.sqlite3
      DATABASE_URL: postgresql+psycopg://video_ai:video_ai_dev@postgres:5432/video_ai
      STORAGE_ROOT: /app/.data/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: video-ai-assets
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: video_ai
      S3_SECRET_ACCESS_KEY: video_ai_dev_password
      S3_PUBLIC_BASE_URL: http://localhost:9000/video-ai-assets
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: video-ai
      VIDEO_GENERATOR_BACKEND: ${VIDEO_GENERATOR_BACKEND:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VLLM_TEXT_BASE_URL: http://vllm-text:8000/v1
      VLLM_VISION_BASE_URL: http://vllm-vision:8000/v1
    volumes:
      - ./.data:/app/.data
    depends_on:
      - redis
      - postgres
      - minio
    profiles: ["prod", "worker"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["prod"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_ai
      POSTGRES_USER: video_ai
      POSTGRES_PASSWORD: video_ai_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_ai -d video_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles: ["prod"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: video_ai
      MINIO_ROOT_PASSWORD: video_ai_dev_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["prod"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 video_ai video_ai_dev_password &&
      mc mb -p local/video-ai-assets &&
      mc anonymous set download local/video-ai-assets || true
      "
    profiles: ["prod"]

  vllm-text:
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_TEXT_MODEL:-Qwen/Qwen3.6-35B-A3B}
      --host 0.0.0.0
      --port 8000
    ports:
      - "8002:8000"
    profiles: ["vllm"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-vision:
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_VISION_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      --host 0.0.0.0
      --port 8000
      --limit-mm-per-prompt image=1
    ports:
      - "8001:8000"
    profiles: ["vllm"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  minio_data:
